name: Build AbuPixels AI Studio

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'One-time source archive URL; used only when the repository has no build.gradle yet'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import sanitized source when the repository has none
        if: ${{ hashFiles('build.gradle') == '' }}
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_URL:-}" ]; then
            echo 'No build.gradle in the repository and no source_url input.' >&2
            exit 1
          fi
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/source.zip
          rm -rf /tmp/source && mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          test -f /tmp/source/abu-ai-studio/build.gradle
          cp -a /tmp/source/abu-ai-studio/. .
          rm -f /tmp/source.zip
          git config user.name 'abu-studio-ci'
          git config user.email 'abu-studio-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Import sanitized AbuPixels AI Studio 1.1.0 source'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Scan the tree for credential-like strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          patterns = [
              re.compile(r'sk-[A-Za-z0-9_-]{20,}'),
              re.compile(r'gsk_[A-Za-z0-9]{20,}'),
              re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
              re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}'),
              re.compile(r'(?<![0-9])[0-9]{8,10}:[A-Za-z0-9_-]{30,}'),
          ]
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file():
                  continue
              if '.git' in p.parts or 'build' in p.parts:
                  continue
              if p.suffix not in {'.java', '.json', '.md', '.gradle', '.properties', '.txt', '.yml'}:
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              for pattern in patterns:
                  for hit in pattern.findall(text):
                      if 'REDACTED' in hit:
                          continue
                      bad.append('%s: %s...' % (p, hit[:4]))
          if bad:
              print('\n'.join(bad))
              sys.exit('credential-like strings found')
          print('no credential-like strings outside test placeholders')
          PY

      - name: Download and verify the official BBS FS 2.7 dependency
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(python3 - <<'PY'
          import json, re, urllib.request
          url = 'https://api.modrinth.com/v2/version/EwbK2XQL'
          with urllib.request.urlopen(url, timeout=30) as response:
              version = json.load(response)
          if version.get('version_number') != '2.7-1.21.11':
              raise SystemExit('Unexpected Modrinth version metadata')
          matches = [f for f in version.get('files', []) if f.get('filename') == 'bbs-2.7-1.21.11.jar']
          if not matches:
              raise SystemExit('The official BBS JAR was not listed by Modrinth')
          file = matches[0]
          file_url = file.get('url', '')
          digest = file.get('hashes', {}).get('sha512', '')
          if not file_url.startswith('https://cdn.modrinth.com/') or any(ord(ch) < 32 or ord(ch) == 127 for ch in file_url) or not re.fullmatch(r'[0-9a-fA-F]{128}', digest):
              raise SystemExit('Modrinth file URL or SHA-512 did not pass validation')
          print(file_url)
          print(digest)
          PY
          )"
          mapfile -t bbs_values <<< "$metadata"
          BBS_URL="${bbs_values[0]}"
          BBS_SHA512="${bbs_values[1]}"
          test -n "$BBS_URL"
          test -n "$BBS_SHA512"
          mkdir -p libs
          curl --fail --location --retry 3 --retry-delay 2 "$BBS_URL" -o libs/bbs-2.7-1.21.11.jar
          echo "$BBS_SHA512  libs/bbs-2.7-1.21.11.jar" | sha512sum --check --status
          echo 'Official BBS FS 2.7 dependency downloaded and SHA-512 verified.'

      - name: Guard against manual background blur calls
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/client/java/dev/abustudio/client/StudioScreen.java \
            src/client/java/dev/abustudio/client/SettingsScreen.java \
            src/client/java/dev/abustudio/client/ProvidersScreen.java \
            src/client/java/dev/abustudio/client/ProviderEditScreen.java; do
            if grep -nF 'renderBackground(' "$file"; then
              echo "Unexpected manual background blur call remains in $file" >&2
              exit 1
            fi
          done

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean build

      - name: Publish release with the production JAR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected one production JAR, found ${#jars[@]}" >&2
            find build/libs -maxdepth 1 -type f -printf '%f\n' >&2 || true
            exit 1
          fi
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "${jars[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AbuPixels AI Studio 1.1.0 for Minecraft 1.21.11" \
            --notes-file RELEASE-NOTES.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url: .url, assets: [.assets[] | {name: .name, url: .url, size: .size}]}'
